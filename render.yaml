services:
  - type: web
    runtime: node
    name: acp-courier2-new
    plan: free
    region: singapore
    rootDir: user-panel
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: acp-courier-db-new
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://acp-courier-new.onrender.com,https://acp-courieruser-new.onrender.com,https://acp-courieruser.onrender.com,https://acp-courieradmin-new.onrender.com
      - key: PUBLIC_API_URL
        value: https://acp-courier2-new.onrender.com
      - key: OTP_SECRET
        generateValue: true
      - key: OTP_DISPLAY_ENABLED
        value: "true"
      - key: DELHIVERY_API_TOKEN
        sync: false
      - key: DELHIVERY_PICKUP_NAME
        value: ARORACOURIER C2C

  - type: web
    runtime: static
    name: acp-courier-new
    rootDir: .
    buildCommand: npm run build
    staticPublishPath: dist

  - type: web
    runtime: static
    name: acp-courieruser-new
    rootDir: user-panel
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The static build runs TypeScript and Vite from devDependencies.
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: VITE_API_URL
        value: https://acp-courier2-new.onrender.com/api
      - key: VITE_SHARED_API_URL
        value: https://acp-courier2-new.onrender.com/api
      - key: VITE_STATIC_DATA_ENABLED
        value: "false"
      - key: VITE_DELHIVERY_PICKUP_NAME
        value: ARORACOURIER C2C
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: static
    name: acp-courieradmin-new
    rootDir: admin-panel
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_STATIC_DATA_ENABLED
        value: "true"
      - key: VITE_API_URL
        value: https://acp-courier2-new.onrender.com/api
      - key: VITE_COURIER_API_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: acp-courier-db-new
    plan: free
    region: singapore
    databaseName: acp_courier
    user: acp_courier
